services:
  - type: web
    name: x5-ai-studio-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: HF_TOKEN
        sync: false
      - key: HF_PROVIDER
        value: fal-ai
      - key: APP_API_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://projdamasioarq-prog.github.io
